<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#edf3f8"><meta name="csrf-token" content="{{ csrf_token() }}">
  <title>检测设置 · 仓鼠的小窝</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script defer src="{{ url_for('static', filename='motion.js') }}"></script>
</head><body><div class="shell">
  <header class="site-header"><a class="brand" href="/"><img class="brand-mark" src="{{ url_for('static', filename='hamster.svg') }}" alt="">仓鼠的小窝<span class="brand-en">PET WATCH</span></a><nav class="site-nav" aria-label="主要导航"><a href="/">实时</a><a href="{{ url_for('events_page') }}">事件</a><a aria-current="page" href="{{ url_for('motion_page') }}">检测设置</a></nav><form class="logout" action="{{ url_for('logout') }}" method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="text-button" type="submit">退出</button></form></header>
  <main><div class="page-heading"><div><p class="eyebrow">MOTION AREA</p><h1>移动检测区域</h1></div><p>拖动画面选择重点区域；使用百分比坐标，切换分辨率后仍然有效。</p></div>
    {% if not enabled %}<p class="notice">检测服务当前已通过配置关闭。</p>{% endif %}
    <section class="settings-card">
      <div class="roi-editor" id="roiEditor"><img id="roiImage" src="{{ url_for('snapshot') }}?preview=1" alt="摄像头当前画面"><div id="roiBox" class="roi-box" aria-label="当前检测区域"></div><div id="roiHint" class="roi-hint">在画面上拖动选择区域</div></div>
      <form id="motionForm" class="motion-form">
        <input type="hidden" id="roiX" value="{{ settings.roi_x }}"><input type="hidden" id="roiY" value="{{ settings.roi_y }}"><input type="hidden" id="roiW" value="{{ settings.roi_w }}"><input type="hidden" id="roiH" value="{{ settings.roi_h }}">
        <label>像素变化阈值 <output id="pixelValue">{{ settings.pixel_threshold|int }}</output><input id="pixelThreshold" type="range" min="5" max="100" step="1" value="{{ settings.pixel_threshold|int }}"></label>
        <label>变化面积阈值 <output id="areaValue">{{ '%.1f'|format(settings.area_ratio * 100) }}%</output><input id="areaRatio" type="range" min="0.2" max="20" step="0.1" value="{{ settings.area_ratio * 100 }}"></label>
        <div class="form-actions"><button id="fullFrame" class="secondary" type="button">恢复全画面</button><button class="primary" type="submit">保存检测设置</button></div><p class="form-help">阈值越低越灵敏，也越容易被阴影、反光和摄像头噪声触发。修改后背景模型会重新学习。</p>
      </form>
    </section><div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </main><footer>小窝看护 <span>默认后台检测 2 FPS</span></footer>
</div></body></html>
