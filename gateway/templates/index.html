<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#edf3f8"><meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{{ camera_name }} · 小窝看护</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script defer src="{{ url_for('static', filename='app.js') }}"></script>
</head>
<body>
  <div class="shell">
    <header class="site-header">
      <a class="brand" href="/" aria-label="小窝看护首页"><span class="brand-mark" aria-hidden="true">⌂</span>小窝看护<span class="brand-en">PET WATCH</span></a>
      <form action="{{ url_for('logout') }}" method="post">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <button class="text-button" type="submit">退出</button>
      </form>
    </header>
    <main>
      <div class="page-heading"><div><p class="eyebrow">家里的这一刻</p><h1>{{ camera_name }}</h1></div><p class="today" id="today"></p></div>
      <section class="monitor" aria-label="宠物实时画面">
        <div class="monitor-bar"><span><span class="dot" id="statusDot"></span><span id="state" role="status" aria-live="polite">准备就绪</span></span><span id="resolutionLabel">等待画面</span></div>
        <div class="viewport" id="viewport">
          <img id="stream" alt="家中宠物摄像头实时画面" hidden>
          <div class="placeholder" id="placeholder"><span class="home-symbol" aria-hidden="true">⌂</span><h2 id="placeholderTitle">小窝就在这里</h2><p id="placeholderText">点击下方按钮，看看它在做什么。</p></div>
          <button class="expand" id="fullscreen" type="button" aria-label="全屏查看">⛶</button>
        </div>
        <div class="controls">
          <button class="primary" id="toggle" type="button">开始观看</button>
          <button class="secondary" id="snapshot" type="button">拍照保存</button>
          <div class="quality-control"><label for="quality">画质</label><select id="quality"><option value="" disabled selected>默认</option><option value="low">流畅 · 320×240</option><option value="standard">标准 · 640×480</option><option value="high">清晰 · 800×600</option></select></div>
        </div>
      </section>
      <div class="under-monitor"><p id="connectionNote">尚未连接摄像头。开始观看后显示连接状态。</p><span>实时查看 · 手动拍照</span></div>
      <section class="photo-tray" id="photoTray" aria-label="刚刚拍摄" hidden><div><p class="eyebrow">刚刚拍摄</p><p>照片已准备好，点击下载保存到设备。</p></div><a id="photoDownload" class="secondary" download>下载照片</a><img id="photoPreview" alt="刚拍摄的宠物照片"></section>
      <p class="tip">离开页面时会暂停观看。想看看它时，再打开这里。</p>
      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </main>
    <footer>小窝看护 <span>陪伴，隔着屏幕也在。</span></footer>
  </div>
</body>
</html>
